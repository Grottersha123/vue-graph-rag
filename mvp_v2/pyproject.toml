[project]
name = "vue-graph-rag-mvp-v2"
version = "0.1.0"
description = "Local Streamlit multimodal Graph RAG"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
