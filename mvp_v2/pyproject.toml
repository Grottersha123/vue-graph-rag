[project]
name = "vue-graph-rag-mvp-v2"
version = "0.1.0"
description = "Local Streamlit multimodal Graph RAG"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.31.0",
    "chonkie>=1.7.0",
    "deepeval>=4.3.0",
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "ladybug==0.19.1",
    "langchain-community>=0.4.2",
    "langchain-experimental>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "loguru>=0.7,<1",
    "mcp>=1.26,<2",
    "pandas>=3.0.5",
    "pillow==12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
    "streamlit==1.63.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "deepeval>=4.3.0",
    "matplotlib>=3.11.2",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vue_rag"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
