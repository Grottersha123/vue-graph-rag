[project]
name = "telegram_classificator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Zero Sable", email = "grottersha123@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "openai>=3.18.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "tenacity>=9.1.4",
    "tqdm>=4.70.1",
]


[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[project.scripts]
classifier = "telegram_classificator:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
